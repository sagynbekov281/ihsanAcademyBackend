<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IhsanAcademy — Админка</title>
<style>
  :root { --bg:#0B0D1A; --card:#111428; --border:#1E2448; --accent:#5B5BD6; --text:#fff; --muted:#7A82A8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); padding:0; }
  .hidden { display:none !important; }
  h1 { font-size:19px; margin:0; }
  input, select, textarea, button { background:#0B0D1A; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 12px; font-size:14px; font-family:inherit; }
  textarea { width:100%; resize:vertical; }
  button { background:var(--accent); border:none; cursor:pointer; font-weight:500; min-height:40px; transition:background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease; }
  button:focus-visible { outline:2px solid #a5b4fc; outline-offset:2px; }
  button:disabled { cursor:wait; opacity:.55; }
  button.secondary { background:transparent; border:1px solid var(--border); color:#C8CEEA; }
  button.danger { background:#ef444422; color:#f87171; border:1px solid #71313d; }
  button.wa { background:#25D366; color:#062b12; }
  button:hover { opacity:.85; }
  button:active { transform:translateY(1px); }
  .login { max-width:340px; width:100%; margin:12vh auto; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; display:flex; flex-direction:column; gap:12px; }
  .login h1 { margin-bottom:6px; }
  .login input, .login button { width:100%; }
  .err { color:#f87171; font-size:13px; min-height:16px; }
  .app-shell { min-height:100vh; display:grid; grid-template-columns:248px minmax(0,1fr); }
  .sidebar { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:24px 14px 16px; background:#0E1021; border-right:1px solid var(--border); z-index:12; }
  .sidebar-brand { display:flex; align-items:center; gap:11px; padding:2px 10px 22px; border-bottom:1px solid var(--border); }
  .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:9px; background:linear-gradient(145deg,#5B5BD6,#3D3FA8); color:#fff; font-weight:800; font-size:13px; }
  .brand-name { font-weight:700; font-size:15px; color:#fff; }
  .brand-caption { margin-top:3px; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
  .nav-label { margin:24px 10px 9px; color:var(--muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
  .tabs { display:grid; gap:5px; min-width:0; }
  .tabs button { width:100%; display:flex; align-items:center; gap:11px; min-height:44px; padding:9px 11px; text-align:left; background:transparent; border:1px solid transparent; border-radius:8px; color:#B7BCD0; font-size:13px; }
  .tabs button:hover { background:#171A30; color:#fff; }
  .tabs button.on { background:#272446; color:#fff; border-color:#3B3768; }
  .nav-icon { width:19px; height:19px; display:grid; place-items:center; color:#A7A4E8; flex:none; }
  .nav-icon svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .sidebar-bottom { margin-top:auto; padding:14px 10px 4px; border-top:1px solid var(--border); color:var(--muted); font-size:11px; }
  .nav-backdrop { display:none; }
  .main-panel { min-width:0; padding:26px 32px 40px; }
  .topbar { display:flex; align-items:center; gap:14px; min-height:42px; margin-bottom:20px; }
  .topbar h1 { color:#fff; font-size:21px; }
  .menu-toggle { display:none; width:40px; height:40px; padding:9px; border:1px solid var(--border); border-radius:8px; background:#111428; color:#fff; }
  .menu-toggle span { display:block; width:19px; height:2px; margin:4px auto; border-radius:2px; background:currentColor; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .bar input { flex:1; min-width:160px; }
  .chk { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; cursor:pointer; }
  .chk input { min-height:auto; }
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; }
  table { width:100%; min-width:640px; border-collapse:collapse; background:var(--card); font-size:13px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.pending, .badge.off { background:#5B5BD622; color:#9B9FE8; }
  .badge.approved, .badge.on { background:#22c55e22; color:#4ade80; }
  .badge.rejected { background:#ef444422; color:#f87171; }
  .badge.sale { background:#f59e0b22; color:#fbbf24; }
  .actions { display:flex; gap:8px; flex-wrap:nowrap; }
  .actions button { padding:6px 10px; font-size:12px; min-height:36px; font-weight:500; }
  s { color:var(--muted); }
  #status { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .empty { padding:32px 16px; text-align:center; color:var(--muted); background:var(--card); border:1px solid var(--border); border-radius:12px; }
  .modal { position:fixed; inset:0; background:#04050Fcc; display:flex; align-items:flex-start; justify-content:center; padding:16px; overflow:auto; z-index:10; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; width:100%; max-width:560px; margin-top:4vh; }
  .box h2 { margin:0 0 16px; font-size:16px; }
  .box label { display:block; font-size:12px; color:var(--muted); margin-bottom:12px; }
  .box label input:not([type=checkbox]), .box label select { width:100%; margin-top:4px; }
  .box label textarea { margin-top:4px; }
  .box label.chk { display:flex; color:var(--text); }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .row button { flex:1; min-width:110px; }
  .confirm-box p { color:var(--muted); font-size:14px; line-height:1.5; margin-bottom:16px; }

  @media (max-width: 960px) {
    .app-shell { grid-template-columns:220px minmax(0,1fr); }
    .main-panel { padding:22px 20px 32px; }
  }
  @media (max-width: 700px) {
    .app-shell { display:block; }
    .sidebar { position:fixed; left:0; top:0; bottom:0; width:min(290px,84vw); height:100dvh; transform:translateX(-102%); transition:transform .22s ease; box-shadow:16px 0 40px #00000040; }
    .sidebar.open { transform:translateX(0); }
    .nav-backdrop { position:fixed; inset:0; z-index:11; display:block; background:#04050fcc; opacity:0; visibility:hidden; transition:opacity .2s ease, visibility .2s ease; }
    .nav-backdrop.open { opacity:1; visibility:visible; }
    .main-panel { padding:16px 16px 28px; }
    .topbar { min-height:42px; margin-bottom:18px; }
    .topbar h1 { width:auto; font-size:18px; }
    .menu-toggle { display:block; flex:none; }
    .nav-label { margin-top:22px; }
    .box { padding:16px; margin-top:0; border-radius:12px 12px 0 0; align-self:flex-end; }
    .modal { align-items:flex-end; padding:0; }
    .table-wrap { overflow:visible; }
    input, select, textarea { font-size:16px; }
    table, tbody { display:block; width:100%; min-width:0; background:transparent; }
    thead { display:none; }
    tbody { display:grid; gap:24px; }
    tr { display:block; padding:18px; border:1px solid var(--border); border-radius:12px; background:var(--card); box-shadow:0 3px 12px #00000022; }
    td { display:grid; grid-template-columns:minmax(82px, 29%) minmax(0, 1fr); align-items:start; gap:14px; padding:13px 0; border-bottom:1px solid var(--border); font-size:14px; line-height:1.45; white-space:normal; overflow-wrap:anywhere; }
    td::before { content:attr(data-label); color:var(--muted); font-size:12px; }
    tr:last-child td { border-bottom:1px solid var(--border); }
    td.actions { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; padding-top:16px; border-bottom:none; }
    td.actions::before { content:attr(data-label); grid-column:1 / -1; }
    .actions button { width:100%; min-width:0; min-height:38px; padding:7px 9px; border:1px solid var(--border); border-radius:7px; background:transparent; color:#C8CEEA; font-size:12px; font-weight:400; }
    .actions button[data-act="approve"] { background:#5B5BD61c; border-color:#5B5BD644; color:#C8CEEA; }
    .actions button.wa { background:#10231e; border-color:#214b3f; color:#8be0bb; }
    .actions button.danger { background:#ef444414; border-color:#71313d; color:#f87171; }
    .bar { align-items:stretch; }
    .bar input { min-width:0; width:100%; }
    .chk { align-items:flex-start; font-size:14px; }
    .chk input { margin-top:2px; }
  }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <h1>IhsanAcademy</h1>
  <div style="color:var(--muted);font-size:13px">Вход в админ-панель</div>
  <input id="pwd" type="password" placeholder="Пароль" autocomplete="current-password" />
  <button id="loginBtn">Войти</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="hidden">
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Навигация админки">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">IA</div>
        <div>
          <div class="brand-name">IhsanAcademy</div>
          <div class="brand-caption">Панель управления</div>
        </div>
      </div>
      <div class="nav-label">Разделы</div>
      <nav class="tabs" aria-label="Разделы">
        <button type="button" data-tab="applications" aria-current="page">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3.75h7l4 4v12.5H7a2 2 0 0 1-2-2v-12a2 2 0 0 1 2-2Z"/><path d="M14 3.75v4h4M9 12h6M9 16h6"/></svg></span>
          <span>Заявки</span>
        </button>
        <button type="button" data-tab="courses">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 5.5A2.5 2.5 0 0 1 7 3h12v16H7a2.5 2.5 0 0 0-2.5 2V5.5Z"/><path d="M4.5 18.5A2.5 2.5 0 0 1 7 16h12"/><path d="M8 7h7M8 10h7"/></svg></span>
          <span>Курсы</span>
        </button>
        <button type="button" data-tab="teachers">
          <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-1.5A4.5 4.5 0 0 1 8 13h2a4.5 4.5 0 0 1 4.5 4.5V19M16 5.5a3 3 0 0 1 0 5.8M17 13h.5a3.5 3.5 0 0 1 3.5 3.5V19"/></svg></span>
          <span>Учителя</span>
        </button>
      </nav>
      <div class="sidebar-bottom">IhsanAcademy · Админка</div>
    </aside>
    <div id="navBackdrop" class="nav-backdrop"></div>
    <main class="main-panel">
      <header class="topbar">
        <button id="menuToggle" class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false"><span></span><span></span><span></span></button>
        <h1 id="pageTitle">Заявки</h1>
      </header>
      <div id="status"></div>
      <div id="content"></div>
    </main>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="box">
    <h2 id="mTitle"></h2>
    <div id="mFields"></div>
    <div id="mErr" class="err"></div>
    <div class="row"><button type="button" id="mSave">Сохранить</button><button type="button" class="secondary" id="mCancel">Отмена</button></div>
  </div>
</div>

<div id="deleteModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
  <div class="box confirm-box">
    <h2 id="deleteTitle">Удалить?</h2>
    <p id="deleteMessage"></p>
    <div id="deleteError" class="err"></div>
    <div class="row"><button type="button" class="danger" id="deleteConfirm">Удалить</button><button type="button" class="secondary" id="deleteCancel">Отмена</button></div>
  </div>
</div>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const API = window.location.origin;
  const ENDPOINT = { applications: '/api/applications', courses: '/api/admin/courses', teachers: '/api/admin/teachers' };
  const STATUS = { pending: 'ожидает', approved: 'одобрена', rejected: 'отклонена' };
  const LEVELS = [['beginner','Начальный'],['intermediate','Средний'],['advanced','Продвинутый']];
  const ICONS = [['code','Код'],['react','React'],['database','База данных'],['brush','Дизайн'],['chart','Аналитика'],['shield','Безопасность'],['phone','Мобильная']];

  const SCHEMA = {
    courses: { one: 'курс', fields: [
      ['title','Название','text'],
      ['description','Короткое описание (в списке)','textarea'],
      ['about','Подробное описание (в окне курса)','textarea'],
      ['duration','Длительность (например: 6 месяцев)','text'],
      ['levelKey','Уровень','select',LEVELS],
      ['iconKey','Иконка','select',ICONS],
      ['price','Цена (сом)','number'],
      ['discountPercent','Скидка, % (0 — нет скидки)','number'],
      ['discountEndsAt','Скидка действует до (пусто — без срока)','date'],
      ['topics','Программа (каждая тема с новой строки)','lines'],
      ['langs','Технологии (через запятую)','list'],
      ['students','Студентов','number'],
      ['projects','Проектов','number'],
      ['order','Порядок (меньше — выше)','number'],
      ['active','Показывать на сайте','checkbox'],
    ]},
    teachers: { one: 'учителя', fields: [
      ['name','Имя и фамилия','text'],
      ['role','Должность','text'],
      ['experience','Опыт (например: 5+ лет)','text'],
      ['subjects','Предметы (через запятую)','list'],
      ['bio','О себе','textarea'],
      ['order','Порядок (меньше — выше)','number'],
      ['active','Показывать на сайте','checkbox'],
    ]},
  };

  let token = localStorage.getItem('ihsan_token') || '';
  let tab = 'applications';
  let editing = null;
  let applicationsPoll = null;
  let refreshingApplications = false;
  let lastApplicationsSnapshot = '';
  let pendingDelete = null;
  let deleteTrigger = null;
  const data = { applications: [], courses: [], teachers: [] };
  const TAB_TITLES = { applications: 'Заявки', courses: 'Курсы', teachers: 'Учителя' };

  function setSidebarOpen(open) {
    $('#sidebar').classList.toggle('open', open);
    $('#navBackdrop').classList.toggle('open', open);
    $('#menuToggle').setAttribute('aria-expanded', String(open));
    $('#menuToggle').setAttribute('aria-label', open ? 'Закрыть меню' : 'Открыть меню');
    document.body.style.overflow = open ? 'hidden' : '';
  }

  $('#menuToggle').addEventListener('click', () => {
    setSidebarOpen(!$('#sidebar').classList.contains('open'));
  });
  $('#navBackdrop').addEventListener('click', () => setSidebarOpen(false));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') setSidebarOpen(false);
  });

  async function api(path, opts = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers.Authorization = 'Bearer ' + token;
    const res = await fetch(API + path, { ...opts, headers });
    let body = {};
    try { body = await res.json(); } catch (e) {}
    if (res.status === 401 && path !== '/api/admin/login') { logout(); throw new Error('Сессия истекла, войдите снова'); }
    if (!res.ok || body.success === false) throw new Error(body.error || (body.errors || []).join(', ') || 'Ошибка ' + res.status);
    return body;
  }

  async function doLogin() {
    $('#loginErr').textContent = '';
    try {
      const r = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: $('#pwd').value }) });
      token = r.token; localStorage.setItem('ihsan_token', token); $('#pwd').value = '';
      start();
    } catch (e) { $('#loginErr').textContent = e.message; }
  }
  function logout() {
    if (applicationsPoll) clearInterval(applicationsPoll);
    applicationsPoll = null;
    token = ''; localStorage.removeItem('ihsan_token');
    $('#deleteModal').classList.add('hidden');
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  }
  function start() {
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    if (applicationsPoll) clearInterval(applicationsPoll);
    applicationsPoll = setInterval(refreshApplications, 3000);
    load();
  }
  $('#loginBtn').addEventListener('click', doLogin);
  $('#pwd').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    setSidebarOpen(false);
    load();
  }));

  async function load() {
    $('#pageTitle').textContent = TAB_TITLES[tab] || 'Админка';
    document.querySelectorAll('[data-tab]').forEach((b) => {
      const active = b.dataset.tab === tab;
      b.classList.toggle('on', active);
      if (active) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    $('#status').textContent = 'Загрузка...'; $('#content').innerHTML = '';
    try {
      const r = await api(ENDPOINT[tab]);
      data[tab] = r[tab] || [];
      if (tab === 'applications') lastApplicationsSnapshot = applicationsSnapshot(data.applications);
      $('#status').textContent = '';
      $('#content').innerHTML = tab === 'applications' ? renderApplications() : renderCatalog(tab);
    } catch (e) { $('#status').textContent = e.message; }
  }

  const applicationsSnapshot = (applications) => JSON.stringify(applications.map((a) => [a._id, a.status, a.createdAt]));

  async function refreshApplications() {
    if (tab !== 'applications' || refreshingApplications || !token) return;
    refreshingApplications = true;
    try {
      const r = await api(ENDPOINT.applications);
      const applications = Array.isArray(r.applications) ? r.applications : [];
      const snapshot = applicationsSnapshot(applications);
      if (snapshot !== lastApplicationsSnapshot) {
        data.applications = applications;
        lastApplicationsSnapshot = snapshot;
        $('#content').innerHTML = renderApplications();
      }
    } catch (e) {
      if (!token) return;
      $('#status').textContent = e.message;
    } finally {
      refreshingApplications = false;
    }
  }

  const table = (heads, rows) => `<div class="table-wrap"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;

  function renderApplications() {
    const wa = localStorage.getItem('ihsan_my_wa') || '';
    const openWa = localStorage.getItem('ihsan_open_wa') !== 'false';
    const bar = `<div class="bar"><input id="myWa" placeholder="Ваш WhatsApp: 996XXXXXXXXX" value="${esc(wa)}">
      <label class="chk"><input type="checkbox" id="openWa" ${openWa ? 'checked' : ''}> При «Одобрить» открывать WhatsApp клиента</label></div>`;
    if (!data.applications.length) return bar + '<div class="empty">Заявок пока нет</div>';
    const rows = data.applications.map((a) => {
      const decided = a.status !== 'pending';
      return `<tr>
      <td data-label="Имя">${esc(a.name)}</td><td data-label="Телефон">+${esc(a.phone)}</td><td data-label="Курс">${esc(a.course)}</td>
      <td data-label="Статус"><span class="badge ${a.status}">${STATUS[a.status] || a.status}</span></td>
      <td data-label="Дата">${new Date(a.createdAt).toLocaleString('ru-RU')}</td>
      <td class="actions" data-label="Действия">
        ${decided ? '' : `<button type="button" data-act="approve" data-id="${a._id}">Одобрить</button><button type="button" class="secondary" data-act="reject" data-id="${a._id}">Отклонить</button>`}
        <button type="button" class="wa" data-act="wa-client" data-id="${a._id}">WhatsApp клиента</button>
        <button type="button" class="secondary" data-act="wa-me" data-id="${a._id}">Отправить себе</button>
        <button type="button" class="danger" data-act="del-app" data-id="${a._id}">Удалить</button>
      </td></tr>`;
    }).join('');
    return bar + table(['Имя','Телефон','Курс','Статус','Дата',''], rows);
  }

  const money = (n) => Number(n).toLocaleString('ru-RU') + ' сом';

  function renderCatalog(kind) {
    const items = data[kind];
    const add = `<div class="bar"><button type="button" data-act="add">＋ Добавить ${SCHEMA[kind].one}</button>
      ${items.length ? '' : '<button type="button" class="secondary" data-act="seed">Загрузить примеры</button>'}</div>`;
    if (!items.length) return add + '<div class="empty">Список пуст</div>';
    const buttons = (i) => `<td class="actions" data-label="Действия"><button type="button" class="secondary" data-act="edit" data-id="${i._id}">Изменить</button><button type="button" class="danger" data-act="del" data-id="${i._id}">Удалить</button></td>`;
    const shown = (i) => `<span class="badge ${i.active ? 'on' : 'off'}">${i.active ? 'на сайте' : 'скрыт'}</span>`;
    if (kind === 'courses') {
      const rows = items.map((c) => `<tr><td data-label="Курс">${esc(c.title)}</td>
        <td data-label="Цена">${c.discountActive ? `<s>${money(c.price)}</s> ${money(c.finalPrice)}` : money(c.price)}</td>
        <td data-label="Скидка">${c.discountActive ? `<span class="badge sale">-${c.discountPercent}%${c.discountEndsAt ? ' до ' + new Date(c.discountEndsAt).toLocaleDateString('ru-RU') : ''}</span>` : '—'}</td>
        <td data-label="Статус">${shown(c)}</td>${buttons(c)}</tr>`).join('');
      return add + table(['Курс','Цена','Скидка','Статус',''], rows);
    }
    const rows = items.map((t) => `<tr><td data-label="Имя">${esc(t.name)}</td><td data-label="Должность">${esc(t.role)}</td><td data-label="Предметы">${esc((t.subjects || []).join(', '))}</td><td data-label="Статус">${shown(t)}</td>${buttons(t)}</tr>`).join('');
    return add + table(['Имя','Должность','Предметы','Статус',''], rows);
  }

  $('#content').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const { act, id } = b.dataset;
    if (act === 'approve') return approve(id);
    if (act === 'reject') return setStatus(id, 'rejected');
    if (act === 'wa-client') return waClient(id);
    if (act === 'wa-me') return waMe(id);
    if (act === 'del-app') return removeApplication(id, b);
    if (act === 'add') return openForm(tab, null);
    if (act === 'edit') return openForm(tab, data[tab].find((x) => x._id === id));
    if (act === 'del') return removeItem(id, b);
    if (act === 'seed') return seed();
  });
  $('#content').addEventListener('change', (e) => {
    if (e.target.id === 'myWa') localStorage.setItem('ihsan_my_wa', e.target.value.trim());
    if (e.target.id === 'openWa') localStorage.setItem('ihsan_open_wa', e.target.checked ? 'true' : 'false');
  });

  const waLink = (phone, text) => 'https://wa.me/' + String(phone).replace(/\D/g, '') + '?text=' + encodeURIComponent(text);
  const findApp = (id) => data.applications.find((x) => x._id === id);

  async function approve(id) {
    const a = findApp(id);
    const win = localStorage.getItem('ihsan_open_wa') !== 'false' ? window.open('', '_blank') : null;
    try {
      const r = await api('/api/applications/' + id + '/status', { method: 'PATCH', body: JSON.stringify({ status: 'approved' }) });
      if (win) win.location.href = waLink(a.phone, 'Здравствуйте, ' + a.name + '! Ваша заявка на курс «' + a.course + '» в IhsanAcademy одобрена. Мы свяжемся с вами, чтобы обсудить детали и начало занятий.');
      if (r.sms && r.sms.attempted) alert(r.sms.ok ? 'SMS клиенту отправлена.\n' + String(r.sms.raw || '').slice(0, 300) : 'SMS клиенту НЕ отправилась:\n' + r.sms.error);
      load();
    } catch (err) { if (win) win.close(); alert(err.message); }
  }
  async function setStatus(id, status) {
    try { await api('/api/applications/' + id + '/status', { method: 'PATCH', body: JSON.stringify({ status }) }); load(); }
    catch (err) { alert(err.message); }
  }
  function showDeleteDialog(kind, id, trigger) {
    pendingDelete = { kind, id };
    deleteTrigger = trigger;
    const item = kind === 'applications' ? findApp(id) : data[kind].find((entry) => entry._id === id);
    const name = kind === 'applications' ? item?.name : item?.title || item?.name;
    $('#deleteTitle').textContent = kind === 'applications' ? 'Удалить заявку?' : 'Удалить запись?';
    $('#deleteMessage').textContent = name
      ? `Запись «${name}» будет удалена без возможности восстановления.`
      : 'Запись будет удалена без возможности восстановления.';
    $('#deleteError').textContent = '';
    $('#deleteModal').classList.remove('hidden');
    $('#deleteCancel').focus();
  }

  function closeDeleteDialog() {
    $('#deleteModal').classList.add('hidden');
    $('#deleteConfirm').disabled = false;
    pendingDelete = null;
    if (deleteTrigger && deleteTrigger.isConnected) deleteTrigger.focus();
    deleteTrigger = null;
  }

  async function deletePendingRecord() {
    if (!pendingDelete) return;
    const { kind, id } = pendingDelete;
    const button = $('#deleteConfirm');
    button.disabled = true;
    $('#deleteError').textContent = '';
    try {
      const endpoint = kind === 'applications' ? '/api/applications/' + id : ENDPOINT[kind] + '/' + id;
      await api(endpoint, { method: 'DELETE' });
      data[kind] = data[kind].filter((entry) => entry._id !== id);
      if (kind === 'applications') {
        lastApplicationsSnapshot = applicationsSnapshot(data.applications);
        $('#content').innerHTML = renderApplications();
      } else {
        $('#content').innerHTML = renderCatalog(kind);
      }
      closeDeleteDialog();
    } catch (err) {
      $('#deleteError').textContent = 'Не удалось удалить: ' + err.message;
    } finally {
      button.disabled = false;
    }
  }
  $('#deleteConfirm').addEventListener('click', deletePendingRecord);
  $('#deleteCancel').addEventListener('click', closeDeleteDialog);
  $('#deleteModal').addEventListener('click', (e) => { if (e.target === $('#deleteModal')) closeDeleteDialog(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#deleteModal').classList.contains('hidden')) closeDeleteDialog(); });
  function waClient(id) {
    const a = findApp(id);
    const message = a.language === 'ky'
      ? `Саламатсызбы, ${a.name}! Бул IhsanAcademy академиясы. Сиз «${a.course}» курсуна катталуу үчүн өтүнмө калтырдыңыз. Сиз менен качан сүйлөшсөк ыңгайлуу?`
      : `Здравствуйте, ${a.name}! Это IhsanAcademy. Вы оставили заявку на курс «${a.course}». Когда вам удобно поговорить?`;
    window.open(waLink(a.phone, message), '_blank');
  }
  function waMe(id) {
    const me = (localStorage.getItem('ihsan_my_wa') || '').trim();
    if (!me) return alert('Впишите свой номер WhatsApp в поле сверху');
    const a = findApp(id);
    window.open(waLink(me, 'Заявка IhsanAcademy\nИмя: ' + a.name + '\nТелефон: +' + a.phone + '\nКурс: ' + a.course + (a.message ? '\nСообщение: ' + a.message : '')), '_blank');
  }

  function fieldHtml([k, label, type, opts], v) {
    const id = 'f_' + k;
    if (type === 'textarea') return `<label>${label}<textarea id="${id}" rows="3">${esc(v)}</textarea></label>`;
    if (type === 'lines') return `<label>${label}<textarea id="${id}" rows="5">${esc((v || []).join('\n'))}</textarea></label>`;
    if (type === 'list') return `<label>${label}<input id="${id}" value="${esc((v || []).join(', '))}"></label>`;
    if (type === 'select') return `<label>${label}<select id="${id}">${opts.map(([val, text]) => `<option value="${val}" ${val === v ? 'selected' : ''}>${text}</option>`).join('')}</select></label>`;
    if (type === 'checkbox') return `<label class="chk"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${label}</label>`;
    if (type === 'date') return `<label>${label}<input type="date" id="${id}" value="${v ? String(v).slice(0, 10) : ''}"></label>`;
    return `<label>${label}<input type="${type}" id="${id}" value="${esc(v)}"></label>`;
  }
  function openForm(kind, item) {
    editing = { kind, id: item ? item._id : null };
    const base = item || { active: true, order: 0, price: 0, discountPercent: 0 };
    $('#mTitle').textContent = (item ? 'Изменить ' : 'Добавить ') + SCHEMA[kind].one;
    $('#mFields').innerHTML = SCHEMA[kind].fields.map((f) => fieldHtml(f, base[f[0]])).join('');
    $('#mErr').textContent = '';
    $('#modal').classList.remove('hidden');
  }
  const closeForm = () => $('#modal').classList.add('hidden');
  $('#mCancel').addEventListener('click', closeForm);

  $('#mSave').addEventListener('click', async () => {
    const { kind, id } = editing;
    const body = {};
    SCHEMA[kind].fields.forEach(([k, , type]) => {
      const el = $('#f_' + k);
      if (type === 'checkbox') body[k] = el.checked;
      else if (type === 'lines') body[k] = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
      else if (type === 'list') body[k] = el.value.split(/[,\n]/).map((s) => s.trim()).filter(Boolean);
      else body[k] = el.value;
    }); 
    try {
      await api(ENDPOINT[kind] + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
      closeForm(); load();
    } catch (err) { $('#mErr').textContent = err.message; }
  });

  const removeApplication = (id, button) => showDeleteDialog('applications', id, button);
  const removeItem = (id, button) => showDeleteDialog(tab, id, button);
  async function seed() {
    try { await api('/api/admin/seed/' + tab, { method: 'POST' }); load(); } catch (err) { alert(err.message); }
  }

  if (token) start(); else $('#login').classList.remove('hidden');
</script>
</body>
</html>
